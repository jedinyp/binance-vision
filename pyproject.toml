[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "binance-vision"
version = "1.0.1"
authors = [
  { name="Philip Jediny", email="jedinyphilip@gmail.com" },
]
description = "A Python package for fetching, storing, and loading historical cryptocurrency data from https://data.binance.vision/."
readme = "README.md"
license = { file="LICENSE" }
requires-python = ">=3.7"
dependencies = [
    "requests",
    "pandas"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]